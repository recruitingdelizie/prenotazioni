<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Prenotazioni Online</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState } = React;

        // Icone Lucide (sostituiscono lucide-react)
        const Users = ({className, style}) => (
            <svg className={className} style={style} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
        );

        const CreditCard = ({className, style}) => (
            <svg className={className} style={style} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
            </svg>
        );

        const Banknote = ({className, style}) => (
            <svg className={className} style={style} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
        );

        const CheckCircle = ({className, style}) => (
            <svg className={className} style={style} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const Settings = ({className, style}) => (
            <svg className={className} style={style} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
        );

        const Edit2 = ({className, style}) => (
            <svg className={className} style={style} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
            </svg>
        );

        const Save = ({className, style}) => (
            <svg className={className} style={style} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
            </svg>
        );

        const X = ({className, style}) => (
            <svg className={className} style={style} fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
            </svg>
        );

        function BookingSystem() {
            const [bookings, setBookings] = useState({});
            const [currentBooking, setCurrentBooking] = useState({
                nome: '',
                cognome: '',
                contatto: '',
                menu: '',
                tavolo: null,
                modalitaPagamento: '',
                tipoPagamento: ''
            });
            const [step, setStep] = useState(1);
            const [showConfirm, setShowConfirm] = useState(false);
            const [showSettings, setShowSettings] = useState(false);
            
            // Configurazione menu editabile
            const [menus, setMenus] = useState([
                { id: 'menu1', nome: 'Menu Terra', descrizione: 'Antipasto, primo, secondo con contorno, dessert', prezzo: 35 },
                { id: 'menu2', nome: 'Menu Mare', descrizione: 'Antipasto di mare, risotto, grigliata mista, dessert', prezzo: 50 }
            ]);
            
            // Configurazione colori editabile
            const [theme, setTheme] = useState({
                // Colori principali
                primaryColor: '#2563eb',
                primaryHover: '#1d4ed8',
                secondaryColor: '#4f46e5',
                
                // Sfondi
                backgroundGradientFrom: '#eff6ff',
                backgroundGradientTo: '#e0e7ff',
                
                // Header
                headerGradientFrom: '#2563eb',
                headerGradientTo: '#4f46e5',
                headerText: '#ffffff',
                
                // Card e elementi
                cardBackground: '#ffffff',
                cardBorder: '#e5e7eb',
                selectedBorder: '#2563eb',
                selectedBackground: '#eff6ff',
                
                // Testo
                textPrimary: '#1f2937',
                textSecondary: '#6b7280',
                
                // Conferma
                confirmGradientFrom: '#dcfce7',
                confirmGradientTo: '#d1fae5',
                successColor: '#22c55e'
            });
            
            const [editingMenu, setEditingMenu] = useState(null);
            const [editingTheme, setEditingTheme] = useState(false);

            const tables = Array.from({ length: 12 }, (_, i) => i + 1);

            const getTableStatus = (tableNum) => {
                const booking = bookings[tableNum] || [];
                return booking.length;
            };

            const handleInputChange = (field, value) => {
                setCurrentBooking({ ...currentBooking, [field]: value });
            };

            const handleTableSelect = (tableNum) => {
                const occupied = getTableStatus(tableNum);
                if (occupied < 8) {
                    setCurrentBooking({ ...currentBooking, tavolo: tableNum });
                }
            };

            const calculateTotal = () => {
                const selectedMenu = menus.find(m => m.id === currentBooking.menu);
                const pricePerPerson = selectedMenu ? selectedMenu.prezzo : 0;
                if (currentBooking.tipoPagamento === 'singola') {
                    return pricePerPerson;
                } else {
                    const tableBookings = bookings[currentBooking.tavolo] || [];
                    return pricePerPerson * (tableBookings.length + 1);
                }
            };

            const canProceed = () => {
                if (step === 1) {
                    return currentBooking.nome && currentBooking.cognome && currentBooking.contatto;
                }
                if (step === 2) {
                    return currentBooking.menu;
                }
                if (step === 3) {
                    return currentBooking.tavolo !== null;
                }
                if (step === 4) {
                    return currentBooking.modalitaPagamento && currentBooking.tipoPagamento;
                }
                return false;
            };

            const confirmBooking = () => {
                const tableNum = currentBooking.tavolo;
                const existing = bookings[tableNum] || [];
                setBookings({
                    ...bookings,
                    [tableNum]: [...existing, currentBooking]
                });
                setShowConfirm(true);
                setTimeout(() => {
                    setShowConfirm(false);
                    setCurrentBooking({
                        nome: '',
                        cognome: '',
                        contatto: '',
                        menu: '',
                        tavolo: null,
                        modalitaPagamento: '',
                        tipoPagamento: ''
                    });
                    setStep(1);
                }, 3000);
            };

            const saveMenu = (menuData) => {
                setMenus(menus.map(m => m.id === menuData.id ? menuData : m));
                setEditingMenu(null);
            };

            const addMenu = () => {
                const newId = `menu${menus.length + 1}`;
                setMenus([...menus, { id: newId, nome: 'Nuovo Menu', descrizione: 'Descrizione', prezzo: 0 }]);
            };

            const deleteMenu = (menuId) => {
                if (menus.length > 1) {
                    setMenus(menus.filter(m => m.id !== menuId));
                }
            };

            if (showSettings) {
                return (
                    <div className="min-h-screen p-4 py-8" style={{ 
                        background: `linear-gradient(to bottom right, ${theme.backgroundGradientFrom}, ${theme.backgroundGradientTo})` 
                    }}>
                        <div className="max-w-6xl mx-auto">
                            <div className="rounded-2xl shadow-2xl overflow-hidden" style={{ backgroundColor: theme.cardBackground }}>
                                <div className="p-6" style={{ 
                                    background: `linear-gradient(to right, ${theme.headerGradientFrom}, ${theme.headerGradientTo})` 
                                }}>
                                    <div className="flex justify-between items-center">
                                        <h1 className="text-3xl font-bold" style={{ color: theme.headerText }}>Impostazioni Sistema</h1>
                                        <button
                                            onClick={() => {
                                                setShowSettings(false);
                                                setEditingTheme(false);
                                            }}
                                            className="p-2 rounded-lg hover:bg-white hover:bg-opacity-20 transition-colors"
                                            style={{ color: theme.headerText }}
                                        >
                                            <X className="w-6 h-6" />
                                        </button>
                                    </div>
                                </div>

                                <div className="p-8">
                                    {/* Gestione Menu */}
                                    <div className="mb-8">
                                        <div className="flex justify-between items-center mb-4">
                                            <h2 className="text-2xl font-bold" style={{ color: theme.textPrimary }}>Gestione Menu</h2>
                                            <button
                                                onClick={addMenu}
                                                className="px-4 py-2 rounded-lg font-semibold transition-colors"
                                                style={{ 
                                                    backgroundColor: theme.primaryColor, 
                                                    color: '#ffffff' 
                                                }}
                                            >
                                                + Aggiungi Menu
                                            </button>
                                        </div>

                                        <div className="space-y-4">
                                            {menus.map(menu => (
                                                <div key={menu.id} className="p-4 rounded-lg border-2" style={{ borderColor: theme.cardBorder }}>
                                                    {editingMenu === menu.id ? (
                                                        <div className="space-y-3">
                                                            <input
                                                                type="text"
                                                                value={menu.nome}
                                                                onChange={(e) => setMenus(menus.map(m => m.id === menu.id ? {...m, nome: e.target.value} : m))}
                                                                className="w-full px-3 py-2 border rounded-lg"
                                                                placeholder="Nome menu"
                                                            />
                                                            <input
                                                                type="text"
                                                                value={menu.descrizione}
                                                                onChange={(e) => setMenus(menus.map(m => m.id === menu.id ? {...m, descrizione: e.target.value} : m))}
                                                                className="w-full px-3 py-2 border rounded-lg"
                                                                placeholder="Descrizione"
                                                            />
                                                            <input
                                                                type="number"
                                                                value={menu.prezzo}
                                                                onChange={(e) => setMenus(menus.map(m => m.id === menu.id ? {...m, prezzo: parseFloat(e.target.value)} : m))}
                                                                className="w-full px-3 py-2 border rounded-lg"
                                                                placeholder="Prezzo"
                                                            />
                                                            <div className="flex space-x-2">
                                                                <button
                                                                    onClick={() => saveMenu(menu)}
                                                                    className="px-4 py-2 rounded-lg font-semibold flex items-center space-x-2"
                                                                    style={{ backgroundColor: theme.successColor, color: '#ffffff' }}
                                                                >
                                                                    <Save className="w-4 h-4" />
                                                                    <span>Salva</span>
                                                                </button>
                                                                <button
                                                                    onClick={() => setEditingMenu(null)}
                                                                    className="px-4 py-2 bg-gray-200 rounded-lg font-semibold"
                                                                >
                                                                    Annulla
                                                                </button>
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <div className="flex justify-between items-center">
                                                            <div>
                                                                <h3 className="text-xl font-bold" style={{ color: theme.textPrimary }}>{menu.nome}</h3>
                                                                <p style={{ color: theme.textSecondary }}>{menu.descrizione}</p>
                                                                <p className="text-2xl font-bold mt-2" style={{ color: theme.primaryColor }}>€{menu.prezzo}</p>
                                                            </div>
                                                            <div className="flex space-x-2">
                                                                <button
                                                                    onClick={() => setEditingMenu(menu.id)}
                                                                    className="p-2 rounded-lg hover:bg-gray-100"
                                                                >
                                                                    <Edit2 className="w-5 h-5" style={{ color: theme.primaryColor }} />
                                                                </button>
                                                                {menus.length > 1 && (
                                                                    <button
                                                                        onClick={() => deleteMenu(menu.id)}
                                                                        className="p-2 rounded-lg hover:bg-red-50"
                                                                    >
                                                                        <X className="w-5 h-5 text-red-500" />
                                                                    </button>
                                                                )}
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Personalizzazione Colori */}
                                    <div>
                                        <div className="flex justify-between items-center mb-4">
                                            <h2 className="text-2xl font-bold" style={{ color: theme.textPrimary }}>Personalizzazione Colori</h2>
                                            <button
                                                onClick={() => setEditingTheme(!editingTheme)}
                                                className="px-4 py-2 rounded-lg font-semibold"
                                                style={{ backgroundColor: theme.primaryColor, color: '#ffffff' }}
                                            >
                                                {editingTheme ? 'Chiudi Editor' : 'Modifica Colori'}
                                            </button>
                                        </div>

                                        {editingTheme && (
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                {Object.entries(theme).map(([key, value]) => (
                                                    <div key={key}>
                                                        <label className="block text-sm font-medium mb-2" style={{ color: theme.textSecondary }}>
                                                            {key.replace(/([A-Z])/g, ' $1').trim()}
                                                        </label>
                                                        <div className="flex space-x-2">
                                                            <input
                                                                type="color"
                                                                value={value}
                                                                onChange={(e) => setTheme({...theme, [key]: e.target.value})}
                                                                className="w-16 h-10 rounded cursor-pointer"
                                                            />
                                                            <input
                                                                type="text"
                                                                value={value}
                                                                onChange={(e) => setTheme({...theme, [key]: e.target.value})}
                                                                className="flex-1 px-3 py-2 border rounded-lg"
                                                            />
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (showConfirm) {
                const selectedMenu = menus.find(m => m.id === currentBooking.menu);
                return (
                    <div className="min-h-screen flex items-center justify-center p-4" style={{ 
                        background: `linear-gradient(to bottom right, ${theme.confirmGradientFrom}, ${theme.confirmGradientTo})` 
                    }}>
                        <div className="rounded-2xl shadow-2xl p-8 max-w-md text-center" style={{ backgroundColor: theme.cardBackground }}>
                            <CheckCircle className="w-20 h-20 mx-auto mb-4" style={{ color: theme.successColor }} />
                            <h2 className="text-3xl font-bold mb-2" style={{ color: theme.textPrimary }}>Prenotazione Confermata!</h2>
                            <p className="mb-4" style={{ color: theme.textSecondary }}>
                                Grazie {currentBooking.nome} {currentBooking.cognome}
                            </p>
                            <div className="rounded-lg p-4 text-left" style={{ backgroundColor: theme.selectedBackground }}>
                                <p className="text-sm" style={{ color: theme.textPrimary }}><strong>Tavolo:</strong> {currentBooking.tavolo}</p>
                                <p className="text-sm" style={{ color: theme.textPrimary }}><strong>Menu:</strong> {selectedMenu?.nome} (€{selectedMenu?.prezzo})</p>
                                <p className="text-sm" style={{ color: theme.textPrimary }}><strong>Pagamento:</strong> {currentBooking.modalitaPagamento === 'carta' ? 'Carta' : 'Contanti'} - {currentBooking.tipoPagamento === 'singola' ? 'Quota singola' : 'Intero tavolo'}</p>
                                <p className="text-sm" style={{ color: theme.textPrimary }}><strong>Totale:</strong> €{calculateTotal()}</p>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen p-4 py-8" style={{ 
                    background: `linear-gradient(to bottom right, ${theme.backgroundGradientFrom}, ${theme.backgroundGradientTo})` 
                }}>
                    <div className="max-w-4xl mx-auto">
                        <button
                            onClick={() => setShowSettings(true)}
                            className="mb-4 px-4 py-2 rounded-lg font-semibold flex items-center space-x-2 ml-auto transition-colors hover:opacity-80"
                            style={{ backgroundColor: theme.primaryColor, color: '#ffffff' }}
                        >
                            <Settings className="w-5 h-5" />
                            <span>Impostazioni</span>
                        </button>

                        <div className="rounded-2xl shadow-2xl overflow-hidden" style={{ backgroundColor: theme.cardBackground }}>
                            <div className="p-6" style={{ 
                                background: `linear-gradient(to right, ${theme.headerGradientFrom}, ${theme.headerGradientTo})` 
                            }}>
                                <h1 className="text-3xl font-bold text-center" style={{ color: theme.headerText }}>Sistema Prenotazioni</h1>
                                <div className="flex justify-center mt-4 space-x-2">
                                    {[1, 2, 3, 4].map(s => (
                                        <div 
                                            key={s} 
                                            className="w-10 h-10 rounded-full flex items-center justify-center text-sm font-semibold"
                                            style={{
                                                backgroundColor: step >= s ? '#ffffff' : theme.primaryHover,
                                                color: step >= s ? theme.primaryColor : '#ffffff'
                                            }}
                                        >
                                            {s}
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="p-8">
                                {step === 1 && (
                                    <div className="space-y-4">
                                        <h2 className="text-2xl font-bold mb-6" style={{ color: theme.textPrimary }}>Dati Cliente</h2>
                                        <div>
                                            <label className="block text-sm font-medium mb-2" style={{ color: theme.textPrimary }}>Nome</label>
                                            <input
                                                type="text"
                                                value={currentBooking.nome}
                                                onChange={(e) => handleInputChange('nome', e.target.value)}
                                                className="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:outline-none"
                                                style={{ borderColor: theme.cardBorder }}
                                                placeholder="Inserisci il nome"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium mb-2" style={{ color: theme.textPrimary }}>Cognome</label>
                                            <input
                                                type="text"
                                                value={currentBooking.cognome}
                                                onChange={(e) => handleInputChange('cognome', e.target.value)}
                                                className="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:outline-none"
                                                style={{ borderColor: theme.cardBorder }}
                                                placeholder="Inserisci il cognome"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium mb-2" style={{ color: theme.textPrimary }}>Contatto (Email o Telefono)</label>
                                            <input
                                                type="text"
                                                value={currentBooking.contatto}
                                                onChange={(e) => handleInputChange('contatto', e.target.value)}
                                                className="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:outline-none"
                                                style={{ borderColor: theme.cardBorder }}
                                                placeholder="email@esempio.com o +39 123 456 7890"
                                            />
                                        </div>
                                    </div>
                                )}

                                {step === 2 && (
                                    <div className="space-y-4">
                                        <h2 className="text-2xl font-bold mb-6" style={{ color: theme.textPrimary }}>Scegli il Menu</h2>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {menus.map(menu => (
                                                <div
                                                    key={menu.id}
                                                    onClick={() => handleInputChange('menu', menu.id)}
                                                    className="p-6 border-2 rounded-xl cursor-pointer transition-all"
                                                    style={{
                                                        borderColor: currentBooking.menu === menu.id ? theme.selectedBorder : theme.cardBorder,
                                                        backgroundColor: currentBooking.menu === menu.id ? theme.selectedBackground : 'transparent'
                                                    }}
                                                >
                                                    <h3 className="text-xl font-bold mb-2" style={{ color: theme.textPrimary }}>{menu.nome}</h3>
                                                    <p className="mb-4" style={{ color: theme.textSecondary }}>{menu.descrizione}</p>
                                                    <p className="text-3xl font-bold" style={{ color: theme.primaryColor }}>€{menu.prezzo}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {step === 3 && (
                                    <div className="space-y-4">
                                        <h2 className="text-2xl font-bold mb-6" style={{ color: theme.textPrimary }}>Selezione Tavolo</h2>
                                        <div className="grid grid-cols-3 sm:grid-cols-4 gap-4">
                                            {tables.map(t => {
                                                const occupied = getTableStatus(t);
                                                const isFull = occupied >= 8;
                                                const isSelected = currentBooking.tavolo === t;
                                                return (
                                                    <div
                                                        key={t}
                                                        onClick={() => !isFull && handleTableSelect(t)}
                                                        className="relative p-6 rounded-xl cursor-pointer transition-all"
                                                        style={{
                                                            backgroundColor: isSelected ? theme.primaryColor : isFull ? '#e5e7eb' : theme.cardBackground,
                                                            color: isSelected ? '#ffffff' : isFull ? '#9ca3af' : theme.textPrimary,
                                                            border: `2px solid ${isSelected ? theme.primaryColor : theme.cardBorder}`,
                                                            cursor: isFull ? 'not-allowed' : 'pointer'
                                                        }}
                                                    >
                                                        <Users className="w-8 h-8 mx-auto mb-2" />
                                                        <p className="text-center font-bold text-lg">Tavolo {t}</p>
                                                        <p className="text-center text-sm">{occupied}/8</p>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}

                                {step === 4 && (
                                    <div className="space-y-6">
                                        <h2 className="text-2xl font-bold mb-6" style={{ color: theme.textPrimary }}>Modalità di Pagamento</h2>
                                        
                                        <div>
                                            <label className="block text-sm font-medium mb-3" style={{ color: theme.textPrimary }}>Tipo di pagamento</label>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div
                                                    onClick={() => handleInputChange('tipoPagamento', 'singola')}
                                                    className="p-4 border-2 rounded-xl cursor-pointer transition-all"
                                                    style={{
                                                        borderColor: currentBooking.tipoPagamento === 'singola' ? theme.selectedBorder : theme.cardBorder,
                                                        backgroundColor: currentBooking.tipoPagamento === 'singola' ? theme.selectedBackground : 'transparent'
                                                    }}
                                                >
                                                    <h4 className="font-bold" style={{ color: theme.textPrimary }}>Quota Singola</h4>
                                                    <p className="text-sm" style={{ color: theme.textSecondary }}>Paga solo la tua quota</p>
                                                </div>
                                                <div
                                                    onClick={() => handleInputChange('tipoPagamento', 'intero')}
                                                    className="p-4 border-2 rounded-xl cursor-pointer transition-all"
                                                    style={{
                                                        borderColor: currentBooking.tipoPagamento === 'intero' ? theme.selectedBorder : theme.cardBorder,
                                                        backgroundColor: currentBooking.tipoPagamento === 'intero' ? theme.selectedBackground : 'transparent'
                                                    }}
                                                >
                                                    <h4 className="font-bold" style={{ color: theme.textPrimary }}>Intero Tavolo</h4>
                                                    <p className="text-sm" style={{ color: theme.textSecondary }}>Paga per tutto il tavolo</p>
                                                </div>
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium mb-3" style={{ color: theme.textPrimary }}>Metodo di pagamento</label>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div
                                                    onClick={() => handleInputChange('modalitaPagamento', 'carta')}
                                                    className="p-4 border-2 rounded-xl cursor-pointer transition-all flex items-center space-x-3"
                                                    style={{
                                                        borderColor: currentBooking.modalitaPagamento === 'carta' ? theme.selectedBorder : theme.cardBorder,
                                                        backgroundColor: currentBooking.modalitaPagamento === 'carta' ? theme.selectedBackground : 'transparent'
                                                    }}
                                                >
                                                    <CreditCard className="w-8 h-8" style={{ color: theme.primaryColor }} />
                                                    <div>
                                                        <h4 className="font-bold" style={{ color: theme.textPrimary }}>Carta</h4>
                                                        <p className="text-sm" style={{ color: theme.textSecondary }}>Pagamento con carta</p>
                                                    </div>
                                                </div>
                                                <div
                                                    onClick={() => handleInputChange('modalitaPagamento', 'contanti')}
                                                    className="p-4 border-2 rounded-xl cursor-pointer transition-all flex items-center space-x-3"
                                                    style={{
                                                        borderColor: currentBooking.modalitaPagamento === 'contanti' ? theme.selectedBorder : theme.cardBorder,
                                                        backgroundColor: currentBooking.modalitaPagamento === 'contanti' ? theme.selectedBackground : 'transparent'
                                                    }}
                                                >
                                                    <Banknote className="w-8 h-8" style={{ color: theme.successColor }} />
                                                    <div>
                                                        <h4 className="font-bold" style={{ color: theme.textPrimary }}>Contanti</h4>
                                                        <p className="text-sm" style={{ color: theme.textSecondary }}>Pagamento in contanti</p>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        {currentBooking.tipoPagamento && (
                                            <div className="rounded-lg p-4 mt-4" style={{ backgroundColor: theme.selectedBackground }}>
                                                <p className="text-lg font-bold" style={{ color: theme.textPrimary }}>Totale da pagare: €{calculateTotal()}</p>
                                            </div>
                                        )}
                                    </div>
                                )}

                                <div className="flex justify-between mt-8">
                                    {step > 1 && (
                                        <button
                                            onClick={() => setStep(step - 1)}
                                            className="px-6 py-3 bg-gray-200 rounded-lg font-semibold hover:bg-gray-300 transition-colors"
                                            style={{ color: theme.textPrimary }}
                                        >
                                            Indietro
                                        </button>
                                    )}
                                    <button
                                        onClick={() => {
                                            if (step < 4) {
                                                setStep(step + 1);
                                            } else {
                                                confirmBooking();
                                            }
                                        }}
                                        disabled={!canProceed()}
                                        className="ml-auto px-6 py-3 rounded-lg font-semibold transition-colors"
                                        style={{
                                            backgroundColor: canProceed() ? theme.primaryColor : '#d1d5db',
                                            color: '#ffffff',
                                            cursor: canProceed() ? 'pointer' : 'not-allowed',
                                            opacity: canProceed() ? 1 : 0.6
                                        }}
                                    >
                                        {step === 4 ? 'Conferma Prenotazione' : 'Avanti'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BookingSystem />);
    </script>
</body>
</html>
